name: Deploy website to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/cloudflare-pages.yml'

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.ASHWCH_COM_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.ASHWCH_COM_CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Jekyll site
        run: |
          docker build -t microverse-docs docs
          docker run --rm \
            -v "$GITHUB_WORKSPACE/docs:/srv/jekyll" \
            -v "$GITHUB_WORKSPACE/_site:/site" \
            microverse-docs \
            bundle exec jekyll build --source /srv/jekyll --destination /site

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy _site --project-name microverse --branch main
